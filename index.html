<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:Prompt,sans-serif;background:#000}
  .ui{position:fixed;left:0;right:0;z-index:10;color:#fff;pointer-events:none}
  .top{top:0;padding:12px 16px;background:linear-gradient(#101638ee,#10163800)}
  .top h1{margin:0;font-size:20px;color:#ffcd28}
  #status{margin-top:4px;font-size:14px;display:inline-block;padding:4px 10px;border-radius:99px;background:#ffffff26}
  #status.ok{background:#1f9d55}
  .bottom{bottom:0;padding:10px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#10163800,#101638f2 35%)}
  #card{pointer-events:auto;margin:0 12px 10px;padding:12px 14px;border-radius:14px;background:#ffffffee;color:#101638;display:none;max-height:38vh;overflow:auto}
  #card h2{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}
  #card .dot{width:16px;height:16px;border-radius:50%}
  #card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0 0 6px;font-size:14px}
  #card dt{color:#555}#card dd{margin:0;font-weight:600}
  #card p{margin:0;font-size:14px;line-height:1.5}
  #card p.cr{margin-top:8px;font-size:11px;color:#666}
  #close{float:right;border:0;background:#101638;color:#fff;border-radius:99px;width:30px;height:30px;font-size:16px}
  .chips{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
  .chips button{flex:none;font:inherit;font-size:15px;padding:9px 14px;border-radius:99px;border:2px solid #ffffff55;background:#ffffff1f;color:#fff;display:flex;align-items:center;gap:6px}
  .chips button.on{background:#ffcd28;color:#101638;border-color:#ffcd28}
  .chips i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .ctrl{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px 0}
  .ctrl button{font:inherit;font-size:14px;padding:7px 12px;border-radius:10px;border:0;background:#ffffff2e;color:#fff}
</style>
</head>
<body>
<div class="ui top">
  <h1>ระบบสุริยะ AR</h1>
  <span id="status">กำลังค้นหาภาพ target… ส่องให้เห็นกรอบดำทั้งกรอบ</span>
</div>

<a-scene embedded vr-mode-ui="enabled:false" loading-screen="enabled:false"
  renderer="logarithmicDepthBuffer:true;antialias:true;colorManagement:true"
  arjs="sourceType:webcam;debugUIEnabled:false;detectionMode:mono;patternRatio:0.5">
  <a-marker id="marker" type="pattern" url="solar.patt" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2" emitevents="true">
    <a-entity id="system" position="0 0.55 0" scale="0.4 0.4 0.4"></a-entity>
    <a-entity id="galaxy" position="0 0.35 0" scale="0.45 0.45 0.45" visible="false"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<div class="ui bottom">
  <div id="card"><button id="close" aria-label="ปิด">✕</button><div id="cardBody"></div></div>
  <div class="chips" id="chips"></div>
  <div class="ctrl">
    <button id="pause">⏸ หยุดหมุน</button>
    <button id="speed">ความเร็ว ×1</button>
    <button id="mode">ดูกาแลคซีทางช้างเผือก</button>
  </div>
</div>

  rows:[['ประเภท','กาแลคซีกังหันมีคาน'],['เส้นผ่านศูนย์กลาง','≈ 100,000 ปีแสง'],['จำนวนดาวฤกษ์','≈ 1–4 แสนล้านดวง'],['ดวงอาทิตย์อยู่ห่างใจกลาง','≈ 26,000 ปีแสง'],['ดวงอาทิตย์โคจรรอบกาแลคซี','≈ 230 ล้านปี/รอบ']],

// ---------- procedural textures ----------
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(seed){
  const R=rng(seed),N=256,p=new Float32Array(N*N);for(let i=0;i<p.length;i++)p[i]=R();
  const g=(i,j,Pp)=>p[(((j%N)+N)%N)*N+((((i%Pp)+Pp)%Pp)%N)];
  const sm=t=>t*t*(3-2*t);
  const v=(x,y,Pp)=>{const xi=Math.floor(x),yi=Math.floor(y),a=sm(x-xi),b=sm(y-yi);
    return (g(xi,yi,Pp)*(1-a)+g(xi+1,yi,Pp)*a)*(1-b)+(g(xi,yi+1,Pp)*(1-a)+g(xi+1,yi+1,Pp)*a)*b};
  return (u,w,f,o)=>{let s=0,amp=.5,fr=f,nm=0;for(let k=0;k<(o||5);k++){s+=amp*v(u*fr,w*fr/2,fr);nm+=amp;amp*=.5;fr*=2}return s/nm};
}
const mix=(a,b,t)=>{t=Math.max(0,Math.min(1,t));return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]};
function tex(w,h,fn){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const im=x.createImageData(w,h),d=im.data;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const o=(j*w+i)*4,r=fn((i+.5)/w,(j+.5)/h);d[o]=r[0];d[o+1]=r[1];d[o+2]=r[2];d[o+3]=r.length>3?r[3]:255}
  x.putImageData(im,0,0);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=4;return t;
}
function radial(stops){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(c)}
const n=makeNoise(7),n2=makeNoise(21);
const lat=v=>Math.abs(v-.5)*2;
const TEX={
 sun:(u,v)=>{const k=n(u,v,16,4);return mix([225,95,5],[255,235,140],k*1.4-.2)},
 mercury:(u,v)=>{const k=n(u,v,8,6),c=n2(u,v,24,2);return mix([85,82,78],[195,188,178],k*1.3-.15-(c>.66?(c-.66)*2:0))},
 venus:(u,v)=>{const w=n2(u,v,3,4);const k=n(u+w*.25,v,4,5);return mix([190,145,80],[248,228,175],k*1.3-.15)},
 earth:(u,v)=>{const h=n(u,v,4,6),L=lat(v);
   if(L>.9||(L>.8&&h>.5))return[236,242,248];
   if(h>.56){const t=(h-.56)/.16;const dry=L<.5&&L>.12&&n2(u,v,5,6)>.53;return dry?mix([205,175,115],[160,120,75],t):mix([55,105,45],[120,110,65],t)}
   return mix([6,22,75],[40,105,175],Math.pow(h/.56,3))},
 clouds:(u,v)=>{const c=n2(u+.37,v,5,5);const a=Math.max(0,Math.min(1,(c-.47)*3.5));return[255,255,255,a*235]},
 mars:(u,v)=>{const k=n(u,v,5,6),L=lat(v);if(L>.92)return[240,235,230];return mix([105,42,22],[210,115,68],k*1.4-.2)},
 jupiter:(u,v)=>{const w=n(u,v,4,4);const b=Math.sin(v*Math.PI*11+w*6)*.5+.5,b2=Math.sin(v*Math.PI*29+w*9)*.5+.5;let c=mix([150,95,60],[240,226,198],b*.75+b2*.25);c=mix(c,[205,160,115],n2(u,v,8,4)-.3);
   const dx=(u-.3)*2,dy=v-.66,e=(dx/.14)**2+(dy/.05)**2;if(e<1)c=mix(c,[200,90,55],(1-e)*1.6);return c},
 saturn:(u,v)=>{const b=Math.sin(v*Math.PI*22+n(u,v,3,3)*2)*.5+.5;return mix([195,165,105],[242,222,172],b)},
 uranus:(u,v)=>{const b=Math.sin(v*Math.PI*10)*.5+.5;return mix([140,205,215],[190,238,242],b*.5+n(u,v,3,3)*.5)},
 neptune:(u,v)=>{const b=Math.sin(v*Math.PI*8+n(u,v,3,4)*3)*.5+.5;let c=mix([35,65,175],[75,115,225],b*.6+n2(u,v,4,4)*.4);
   const e=((u-.6)*2/.07)**2+((v-.6)/.03)**2;if(e<1)c=mix(c,[15,25,90],1-e);return c}
};
function ringTex(){const S=512,c=document.createElement('canvas');c.width=S;c.height=4;const x=c.getContext('2d');
  for(let px=0;px<S;px++){const t=px/S;let a=.35+.55*n2(t,0.1,40,3);if(t>.58&&t<.66)a*=.08;if(t<.12)a*=.35;
    const col=mix([150,130,100],[235,215,175],n(t,.3,20,2));x.fillStyle=`rgba(${col[0]|0},${col[1]|0},${col[2]|0},${a.toFixed(3)})`;x.fillRect(px,0,1,4)}
  const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t}
const LOADER=new T.TextureLoader();
function real(files,cb){files=[].concat(files);const tryI=i=>{if(i>=files.length)return;
  LOADER.load(files[i],t=>{t.anisotropy=4;cb(t)},undefined,()=>tryI(i+1))};tryI(0)}
const useMap=(mat,files)=>real(files,t=>{t.encoding=T.sRGBEncoding;mat.map=t;mat.needsUpdate=true});
const dotTex=radial([[0,'rgba(255,255,255,1)'],[.25,'rgba(255,255,255,.8)'],[1,'rgba(255,255,255,0)']]);

// ---------- real texture files (Solar System Scope, CC BY 4.0) ----------
const CDN='https://cdn.jsdelivr.net/gh/elymas/solar-simulator@main/public/textures/';
const src=f=>[f,CDN+f];
const FILES={mercury:src('2k_mercury.jpg'),venus:['2k_venus_atmosphere.jpg'],earth:src('2k_earth_daymap.jpg'),mars:src('2k_mars.jpg'),
  jupiter:src('2k_jupiter.jpg'),saturn:src('2k_saturn.jpg'),uranus:src('2k_uranus.jpg'),neptune:src('2k_neptune.jpg')};
const WM='https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Artist%E2%80%99s_impression_of_the_Milky_Way.jpg/';
const MW_FILES=['milkyway.jpg','PIA10748.jpg',WM+'1920px-Artist%E2%80%99s_impression_of_the_Milky_Way.jpg',WM+'1280px-Artist%E2%80%99s_impression_of_the_Milky_Way.jpg'];
// ---------- solar system ----------
let speed=1,paused=false;
const bodies={},pivots=[],spins=[];
function buildSolar(){
  const root=new T.Group();
  // sun
  const sunMat=new T.MeshBasicMaterial({map:tex(512,256,TEX.sun)});useMap(sunMat,src('2k_sun.jpg'));
  const sun=new T.Mesh(new T.SphereGeometry(P[0].r,64,48),sunMat);
  const glowM=(c,o)=>new T.SpriteMaterial({map:radial([[0,c],[1,'rgba(255,120,0,0)']]),blending:T.AdditiveBlending,depthWrite:false,transparent:true,opacity:o});
  const g1=new T.Sprite(glowM('rgba(255,220,120,1)',.9));g1.scale.setScalar(P[0].r*3.2);
  const g2=new T.Sprite(glowM('rgba(255,160,40,.8)',.55));g2.scale.setScalar(P[0].r*6);
  const sunG=new T.Group();sunG.add(sun,g1,g2);root.add(sunG);bodies.sun=sunG;spins.push([sun,.15]);
  root.add(new T.PointLight(0xfff2dd,1.7,0,0));root.add(new T.AmbientLight(0xffffff,.13));
  P.slice(1).forEach((p,i)=>{
    const ring=new T.Mesh(new T.RingGeometry(p.orb-.006,p.orb+.006,128),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.22,side:T.DoubleSide,depthWrite:false}));
    ring.rotation.x=-Math.PI/2;root.add(ring);
    const piv=new T.Group();piv.rotation.y=(i+1)*0.82;root.add(piv);
    const holder=new T.Group();holder.position.x=p.orb;piv.add(holder);
    const big=p.r>.2;
    const mat=new T.MeshStandardMaterial({map:tex(big||p.id==='earth'?512:256,big||p.id==='earth'?256:128,TEX[p.id]),roughness:1,metalness:0});
    useMap(mat,FILES[p.id]);
    const m=new T.Mesh(new T.SphereGeometry(p.r,64,48),mat);
    if(p.id==='uranus')holder.rotation.z=1.71;
    holder.add(m);spins.push([m,p.id==='venus'?-.2:.6]);
    if(p.id==='earth'){
      const clMat=new T.MeshStandardMaterial({map:tex(512,256,TEX.clouds),transparent:true,depthWrite:false,roughness:1});
      real(src('2k_earth_clouds.jpg'),t=>{clMat.map=null;clMat.color.set(0xffffff);clMat.alphaMap=t;clMat.opacity=.9;clMat.needsUpdate=true});
      const cl=new T.Mesh(new T.SphereGeometry(p.r*1.02,64,48),clMat);
      holder.add(cl);spins.push([cl,.75]);
      const atm=new T.Sprite(new T.SpriteMaterial({map:radial([[0,'rgba(120,180,255,0)'],[.62,'rgba(120,180,255,0)'],[.7,'rgba(120,180,255,.55)'],[1,'rgba(120,180,255,0)']]),blending:T.AdditiveBlending,depthWrite:false,transparent:true}));
      atm.scale.setScalar(p.r*2.9);holder.add(atm);
      const mp=new T.Group();const moonMat=new T.MeshStandardMaterial({map:tex(128,64,TEX.mercury),roughness:1});useMap(moonMat,src('2k_moon.jpg'));const moon=new T.Mesh(new T.SphereGeometry(.035,32,24),moonMat);
      moon.position.x=p.r+.12;mp.add(moon);holder.add(mp);spins.push([mp,2.5]);
    }
    if(p.ring){
      const ri=p.r*1.24,ro=p.r*2.33,geo=new T.RingGeometry(ri,ro,160,1),pa=geo.attributes.position,ua=geo.attributes.uv,vv=new T.Vector3();
      for(let k=0;k<pa.count;k++){vv.fromBufferAttribute(pa,k);ua.setXY(k,(vv.length()-ri)/(ro-ri),.5)}
      const rMat=new T.MeshStandardMaterial({map:ringTex(),transparent:true,side:T.DoubleSide,depthWrite:false,roughness:1});useMap(rMat,src('2k_saturn_ring_alpha.png'));
      const rg=new T.Mesh(geo,rMat);
      rg.rotation.x=-Math.PI/2+.47;holder.add(rg);
    }
    bodies[p.id]=holder;
    pivots.push([piv,Math.round(1400*Math.sqrt(p.days))]);
  });
  // background stars
  const R=rng(3),N=1400,pos=new Float32Array(N*3),col=new Float32Array(N*3);
  for(let i=0;i<N;i++){const th=R()*Math.PI*2,ph=Math.acos(R()*1.3-.3),r=5+R()*4;
    pos.set([r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph),r*Math.sin(ph)*Math.sin(th)],i*3);
    const t=R();col.set(t<.15?[1,.8,.6]:t<.35?[.7,.8,1]:[1,1,1],i*3)}
  const sg=new T.BufferGeometry();sg.setAttribute('position',new T.BufferAttribute(pos,3));sg.setAttribute('color',new T.BufferAttribute(col,3));
  root.add(new T.Points(sg,new T.PointsMaterial({size:.09,map:dotTex,vertexColors:true,transparent:true,depthWrite:false,blending:T.AdditiveBlending})));
  return root;
}

// ---------- Milky Way ----------
let galaxyRoot,sunMark;
function buildGalaxy(){
  const root=new T.Group(),R=rng(11),N=14000,pos=new Float32Array(N*3),col=new Float32Array(N*3);
  const gauss=()=>{let u=0,v=0;while(!u)u=R();v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const core=[1,.85,.6],arm=[.55,.68,1],pink=[1,.45,.7];
  for(let i=0;i<N;i++){let x,y,z,c;
    const t=R();
    if(t<.22){const r=Math.abs(gauss())*.45;const a=R()*Math.PI*2;x=r*Math.cos(a)*1.6;z=r*Math.sin(a)*.7;y=gauss()*.12*(1-r);c=core} // bulge+bar
    else{const armI=Math.floor(R()*4),major=armI<2;const r=.35+Math.pow(R(),major?.8:1)*3.2;
      const a=armI*Math.PI/2+(major?0:Math.PI/4)+Math.log(r/.35)*2.3;const sc=gauss()*(major?.13:.2)*(.5+r*.25);
      x=r*Math.cos(a)+sc*Math.cos(a+1.57);z=r*Math.sin(a)+sc*Math.sin(a+1.57);y=gauss()*.04;
      c=mix(core,arm,(r-.3)/1.8);if(R()<.04)c=pink;c=c.map(k=>k*(.6+R()*.4))}
    pos.set([x,y,z],i*3);col.set(c,i*3)}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(pos,3));g.setAttribute('color',new T.BufferAttribute(col,3));
  const disk=new T.Points(g,new T.PointsMaterial({size:.07,map:dotTex,vertexColors:true,transparent:true,depthWrite:false,blending:T.AdditiveBlending}));root.add(disk);
  // real image (NASA/JPL-Caltech/R. Hurt) — replaces the particle disk once loaded
  real(MW_FILES,t=>{t.encoding=T.sRGBEncoding;
    const pl=new T.Mesh(new T.PlaneGeometry(8,8),new T.MeshBasicMaterial({map:t,transparent:true,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide}));
    pl.rotation.x=-Math.PI/2;root.add(pl);
    const hp=new Float32Array(2500*3);for(let i=0;i<2500;i++){const a=R()*Math.PI*2,r=Math.sqrt(R())*3.4;hp.set([r*Math.cos(a),gauss()*.06*(1.2-r/3.6),r*Math.sin(a)],i*3)}
    const hg=new T.BufferGeometry();hg.setAttribute('position',new T.BufferAttribute(hp,3));
    root.remove(disk);root.add(new T.Points(hg,new T.PointsMaterial({size:.035,map:dotTex,color:0xdfe6ff,transparent:true,opacity:.7,depthWrite:false,blending:T.AdditiveBlending})));
    glow.material.opacity=.35;sunMark.position.set(0,.03,1.88);
  });
  const glow=new T.Sprite(new T.SpriteMaterial({map:radial([[0,'rgba(255,230,180,1)'],[.3,'rgba(255,190,120,.45)'],[1,'rgba(255,160,80,0)']]),blending:T.AdditiveBlending,depthWrite:false,transparent:true}));
  glow.scale.set(2.4,2.4,1);root.add(glow);
  // sun marker ~26,000 / 50,000 of radius
  sunMark=new T.Group();sunMark.position.set(1.85,.02,0.6);
  sunMark.add(new T.Mesh(new T.SphereGeometry(.05,16,12),new T.MeshBasicMaterial({color:0xffe14d})));
  const ring=new T.Mesh(new T.RingGeometry(.09,.12,48),new T.MeshBasicMaterial({color:0xffe14d,side:T.DoubleSide,transparent:true}));ring.rotation.x=-Math.PI/2;sunMark.add(ring);sunMark.userData.ring=ring;
  root.add(sunMark);
  return root;
}

AFRAME.registerComponent('cosmos',{
  init(){
    const s=buildSolar();document.querySelector('#system').setObject3D('mesh',s);
    galaxyRoot=buildGalaxy();document.querySelector('#galaxy').setObject3D('mesh',galaxyRoot);
  },
  tick(t,dt){
    if(!dt)return;dt=Math.min(dt,100)/1000;
    if(sunMark){const k=1+.35*Math.sin(t/250);sunMark.userData.ring.scale.set(k,k,k);sunMark.userData.ring.material.opacity=1.2-k*.6}
    if(paused)return;
    pivots.forEach(([g,dur])=>g.rotation.y+=Math.PI*2*dt*1000/dur*speed);
    spins.forEach(([m,w])=>m.rotation.y+=w*dt*speed);
    if(galaxyRoot)galaxyRoot.rotation.y+=.05*dt*speed;
  }
});
{const sc=document.querySelector('a-scene');const go=()=>sc.setAttribute('cosmos','');sc.hasLoaded?go():sc.addEventListener('loaded',go)}

chips.innerHTML=P.map(p=>`<button data-id="${p.id}"><i style="background:${p.col}"></i>${p.th}</button>`).join('');
let cur=null;
const show=p=>{body.innerHTML=`<h2><span class="dot" style="background:${p.col}"></span>${p.th}</h2><dl>${p.rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl><p>${p.fact}</p><p class="cr">ภาพพื้นผิวดาว: Solar System Scope (CC BY 4.0) จากข้อมูล NASA • ภาพทางช้างเผือก: NASA/JPL-Caltech/ESO/R. Hurt</p>`;card.style.display='block'};
function select(id){
  if(cur&&bodies[cur])bodies[cur].scale.setScalar(1);
  chips.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  cur=id;
  if(!id){card.style.display='none';return}
  show(P.find(x=>x.id===id));
  if(bodies[id])bodies[id].scale.setScalar(id==='sun'?1.3:2.2);
}
chips.addEventListener('click',e=>{const b=e.target.closest('button');if(b)select(cur===b.dataset.id?null:b.dataset.id)});
document.getElementById('close').addEventListener('click',()=>{select(null);card.style.display='none'});
document.getElementById('pause').addEventListener('click',e=>{paused=!paused;e.target.textContent=paused?'▶ เล่นต่อ':'⏸ หยุดหมุน'});
const speeds=[1,2,4,0.5];let si=0;
document.getElementById('speed').addEventListener('click',e=>{si=(si+1)%speeds.length;speed=speeds[si];e.target.textContent='ความเร็ว ×'+speed});
let gal=false;
document.getElementById('mode').addEventListener('click',e=>{
  gal=!gal;select(null);
  document.getElementById('system').setAttribute('visible',!gal);

  document.querySelector('.top h1').textContent=gal?'กาแลคซีทางช้างเผือก AR':'ระบบสุริยะ AR';
  if(gal)show(GAL);
});

marker.addEventListener('markerFound',()=>{st.textContent=gal?'เจอภาพแล้ว! จุดเหลืองคือดวงอาทิตย์ของเรา':'เจอภาพแล้ว! แตะชื่อดาวด้านล่างเพื่อดูข้อมูล';st.classList.add('ok')});
marker.addEventListener('markerLost',()=>{st.textContent='ภาพหลุดจากกล้อง… ส่องให้เห็นกรอบดำทั้งกรอบ';st.classList.remove('ok')});
}
